<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigitalNest — Premium AI & Creator Assets Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: #0f131f;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent: #38bdf8;
      --success: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Top Announcement Bar */
    .announcement-bar {
      background: linear-gradient(90deg, #4f46e5, #6366f1, #38bdf8);
      color: white;
      text-align: center;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .glow-bg {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 500px;
      background: radial-gradient(circle, rgba(99,102,241,0.16) 0%, rgba(7,9,14,0) 70%);
      z-index: -1;
      pointer-events: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      text-decoration: none;
    }

    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: white;
      font-weight: 800;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--text-main);
    }

    .nav-cta {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main) !important;
      padding: 8px 18px;
      border-radius: 9px;
      border: 1px solid var(--border-subtle);
    }

    .nav-cta:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 90px 8% 60px;
      max-width: 980px;
      margin: 0 auto;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 22px;
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
    }

    .hero h1 {
      font-size: clamp(38px, 5.5vw, 60px);
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin-bottom: 20px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 18px;
      color: var(--text-muted);
      max-width: 660px;
      margin: 0 auto 34px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: white;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 10px 25px var(--primary-glow);
      transition: transform 0.2s, box-shadow 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(99, 102, 241, 0.5);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      padding: 14px 26px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      border: 1px solid var(--border-subtle);
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: #1a2030;
    }

    /* Trust Strip */
    .trust-strip {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      padding: 24px 8%;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(15, 19, 31, 0.5);
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trust-item span {
      color: var(--accent);
      font-weight: 700;
    }

    /* Products Section */
    .section {
      padding: 80px 8%;
      max-width: 1240px;
      margin: 0 auto;
    }

    .section-header {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-header h2 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 10px;
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 16px;
    }

    /* Filter Buttons */
    .filter-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(99, 102, 241, 0.5);
    }

    .card-visual {
      height: 200px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .visual-1 { background: linear-gradient(135deg, #1e1b4b, #312e81); }
    .visual-2 { background: linear-gradient(135deg, #0f172a, #0369a1); }
    .visual-3 { background: linear-gradient(135deg, #1e1b4b, #581c87); }

    .badge-tag {
      align-self: flex-start;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .mockup-title {
      font-size: 21px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.4px;
    }

    .mockup-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.75);
    }

    .card-body {
      padding: 26px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-body h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .card-body p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .features {
      list-style: none;
      margin-bottom: 24px;
      font-size: 13px;
      color: #cbd5e1;
    }

    .features li {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .features li::before {
      content: "✓";
      color: var(--accent);
      font-weight: 800;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price-box .old-price {
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: line-through;
      margin-right: 6px;
    }

    .price-box .price {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
    }

    .buy-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 11px 20px;
      border-radius: 9px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .buy-btn:hover {
      background: #4f46e5;
      transform: scale(1.03);
    }

    /* Testimonials */
    .testimonials {
      background: rgba(15, 19, 31, 0.6);
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      padding: 80px 8%;
    }

    .testimonial-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1240px;
      margin: 0 auto;
    }

    .testimonial-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 24px;
      border-radius: 14px;
    }

    .stars {
      color: #f59e0b;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .testimonial-text {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .author {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

      font-size: 1
